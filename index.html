<script>
  let currentSubject = "General";

  function selectSubject(subject) {
    currentSubject = subject;

    document.getElementById("subjectLabel").textContent = subject;
    document.getElementById("selectedSubject").textContent = subject;

    showToast(subject + " चुना गया ✅");
  }

  async function askAI() {
    const input = document.getElementById("question");
    const text = input.value.trim();

    if (!text) {
      showToast("पहले अपना सवाल लिखो ✍️");
      return;
    }

    addMessage(escapeHTML(text), "user");

    input.value = "";

    const loadingId = addLoadingMessage();

    try {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          question: text,
          subject: currentSubject
        })
      });

      const data = await response.json();

      removeLoadingMessage(loadingId);

      if (!response.ok) {
        addMessage(
          "❌ " + escapeHTML(data.error || "कुछ गलत हो गया।"),
          "ai"
        );
        return;
      }

      addMessage(formatAIResponse(data.answer), "ai");

    } catch (error) {
      removeLoadingMessage(loadingId);

      addMessage(
        "❌ Server से connection नहीं हो पाया। क्या StudyPro AI server चालू है?",
        "ai"
      );
    }
  }

  function addMessage(text, type) {
    const box = document.getElementById("messages");

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = text;

    message.appendChild(bubble);
    box.appendChild(message);

    box.scrollTop = box.scrollHeight;
  }

  function addLoadingMessage() {
    const box = document.getElementById("messages");

    const id = "loading-" + Date.now();

    const message = document.createElement("div");
    message.className = "message ai";
    message.id = id;

    message.innerHTML = `
      <div class="bubble">
        🤖 सोच रहा हूँ<span class="dots">...</span>
      </div>
    `;

    box.appendChild(message);
    box.scrollTop = box.scrollHeight;

    return id;
  }

  function removeLoadingMessage(id) {
    const element = document.getElementById(id);

    if (element) {
      element.remove();
    }
  }

  function formatAIResponse(text) {
    let safe = escapeHTML(text);

    safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    safe = safe.replace(
      /\n/g,
      "<br>"
    );

    return safe;
  }

  function quickTool(tool) {
    const prompts = {
      notes:
        "इस topic के आसान और exam-friendly notes बनाओ। Important points और formulas भी दो।",

      quiz:
        "इस topic पर 10 MCQ quiz बनाओ। पहले questions दो और अंत में answers दो।",

      revision:
        "इस topic का quick revision तैयार करो। Important definitions, formulas और key points शामिल करो।",

      planner:
        "मेरे लिए एक practical daily study plan बनाओ जिसमें subjects, study sessions और revision शामिल हों।"
    };

    document.getElementById("question").value = prompts[tool];

    document.getElementById("question").focus();

    showToast("AI tool तैयार है ✨");
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    document.getElementById("themeBtn").textContent =
      dark ? "☀️" : "🌙";

    localStorage.setItem(
      "studypro-theme",
      dark ? "dark" : "light"
    );
  }

  function loadTheme() {
    const saved = localStorage.getItem("studypro-theme");

    if (saved === "dark") {
      document.body.classList.add("dark");
      document.getElementById("themeBtn").textContent = "☀️";
    }
  }

  function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 1800);
  }

  function escapeHTML(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document
    .getElementById("question")
    .addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        askAI();
      }
    });

  loadTheme();
      </script>
