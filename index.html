<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 AI Maths Teacher Pro</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent: #f093fb;
      --dark: #1a1a2e;
      --success: #00b894;
      --danger: #ff7675;
      --glass: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.18);
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg,var(--dark),#16213e);
      min-height: 100vh;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header,
    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg,var(--primary),var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #ccc;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--accent);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #ddd;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: rgba(0,0,0,.25);
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #aaa;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(102,126,234,.25);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
    }

    .btn-primary {
      background: linear-gradient(135deg,var(--primary),var(--secondary));
      color: white;
    }

    .btn-secondary {
      background: rgba(255,255,255,.1);
      color: white;
      border: 1px solid var(--border);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .answer {
      background: rgba(0,0,0,.3);
      border-left: 4px solid var(--success);
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255,118,117,.15);
      border: 1px solid var(--danger);
      color: #ffb3b0;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      margin: 0 auto 12px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .security-note {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width:600px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .card {
        padding: 18px;
      }

      .btn-group {
        flex-direction: column;
      }
    }
  </style></head><body><div class="container">  <div class="header">
    <h1>🧮 AI Maths Teacher Pro</h1>
    <p>Step-by-step Maths Learning with OpenAI</p>
  </div>  <div class="card"><div class="card-title">
  📝 Maths Question
</div>

<label for="mathQuestion">
  अपना Maths Question लिखें:
</label>

<textarea
  id="mathQuestion"
  maxlength="5000"
  placeholder="उदाहरण: x² + 5x + 6 = 0 को step-by-step solve करो..."
></textarea>

<div class="btn-group">

  <button
    class="btn-secondary"
    id="clearBtn"
    type="button">
    🗑️ Clear
  </button>

  <button
    class="btn-primary"
    id="submitBtn"
    type="button">
    🚀 समझाओ
  </button>

</div>

<div id="errorBox" class="error"></div>

  </div>  <div class="card"><div class="card-title">
  💡 AI Answer
</div>

<div id="resultContent" class="answer">
  यहाँ आपका AI answer दिखाई देगा।
</div>

<div class="btn-group">

  <button
    class="btn-secondary"
    id="copyBtn"
    type="button">
    📋 Copy
  </button>

  <button
    class="btn-secondary"
    id="clearAnswerBtn"
    type="button">
    ❌ Clear Answer
  </button>

</div>

  </div>  <div class="security-note">
    🔐 OpenAI API key server पर सुरक्षित है।
    आपको बार-बार API key डालने की जरूरत नहीं।
  </div></div><script>

const questionInput =
  document.getElementById("mathQuestion");

const submitBtn =
  document.getElementById("submitBtn");

const clearBtn =
  document.getElementById("clearBtn");

const copyBtn =
  document.getElementById("copyBtn");

const clearAnswerBtn =
  document.getElementById("clearAnswerBtn");

const resultContent =
  document.getElementById("resultContent");

const errorBox =
  document.getElementById("errorBox");


submitBtn.addEventListener("click", askAI);


clearBtn.addEventListener("click", () => {

  questionInput.value = "";

  errorBox.style.display = "none";

});


clearAnswerBtn.addEventListener("click", () => {

  resultContent.textContent =
    "यहाँ आपका AI answer दिखाई देगा।";

});


copyBtn.addEventListener("click", async () => {

  const text =
    resultContent.textContent.trim();

  if (!text) return;

  try {

    await navigator.clipboard.writeText(text);

    copyBtn.textContent = "✅ Copied!";

    setTimeout(() => {

      copyBtn.textContent = "📋 Copy";

    },1500);

  } catch {

    showError(
      "Answer copy नहीं हो पाया।"
    );

  }

});


async function askAI() {

  const question =
    questionInput.value.trim();

  errorBox.style.display = "none";


  if (!question) {

    showError(
      "❌ कृपया Maths question लिखें।"
    );

    return;

  }


  submitBtn.disabled = true;

  submitBtn.textContent =
    "⏳ AI सोच रहा है...";


  resultContent.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p>AI आपका question solve कर रहा है...</p>
    </div>
  `;


  try {

    const response =
      await fetch("/api/solve", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: question
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Server error"
      );

    }


    resultContent.textContent =
      data.answer;


  } catch(error) {

    console.error(error);

    resultContent.textContent =
      "Answer उपलब्ध नहीं है।";

    showError(
      "❌ AI से answer नहीं मिल पाया। Server और API configuration check करें।"
    );


  } finally {

    submitBtn.disabled = false;

    submitBtn.textContent =
      "🚀 समझाओ";

  }

}


function showError(message) {

  errorBox.textContent = message;

  errorBox.style.display = "block";

}

</script></body>
</html>
